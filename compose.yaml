name: fechaturma-db
services:
  sql:
    image: mcr.microsoft.com/mssql/server@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: '${SQL_ADMIN_PASSWORD:?Execute python3 scripts/bootstrap-db.py}'
      MSSQL_MEMORY_LIMIT_MB: '1536'
    ports: ['127.0.0.1:51433:1433']
    volumes: ['sql-data:/var/opt/mssql']
    healthcheck:
      test: ['CMD-SHELL', 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SET NOCOUNT ON; SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 48
  oracle:
    image: gvenzl/oracle-xe@sha256:ecdf4302ac3d134e1bac5ef6e0c223c2d0f4d4d2b6d551aa79b2346f1ab8f792
    environment:
      ORACLE_PASSWORD: '${ORACLE_ADMIN_PASSWORD:?Execute python3 scripts/bootstrap-db.py}'
      DEMO_READER_PASSWORD: '${ORACLE_READER_PASSWORD:?Execute python3 scripts/bootstrap-db.py}'
    ports: ['127.0.0.1:51521:1521']
    volumes:
      - 'oracle-data:/opt/oracle/oradata'
      - './database/oracle:/container-entrypoint-initdb.d:ro'
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 48
volumes:
  sql-data:
  oracle-data:
