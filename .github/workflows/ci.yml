name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  databases:
    name: SQL Server and Oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.428'
      - name: Run unit tests
        run: dotnet test tests/FechaTurma.Core.Tests -c Release -p:RestoreLockedMode=true
      - name: Exercise the desktop HTTP client on loopback
        run: dotnet run --project tests/FechaTurma.Desktop.Tests -c Release -p:RestoreLockedMode=true
      - name: Provision isolated database engines
        run: |
          python3 scripts/bootstrap-db.py
          docker compose up -d --wait --wait-timeout 250
          python3 scripts/bootstrap-db.py --init-sql
      - name: Assert provider scope and transaction behavior on real engines
        run: python3 scripts/bootstrap-db.py --exec dotnet test tests/FechaTurma.Data.Tests -c Release -p:RestoreLockedMode=true
      - name: Remove isolated lab instances
        if: always()
        run: if test -f .env; then docker compose down --volumes; fi

  windows:
    name: .NET Framework 4.8 and browser workflow
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.428'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            legacy-ui/package-lock.json
            tests/browser/package-lock.json
      - name: Test Angular view filtering
        run: |
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix frontend
      - name: Build Web Forms, MVC, Angular and WinForms
        shell: powershell
        run: scripts/build-windows.ps1
      - name: Install IIS Express if absent
        shell: powershell
        run: scripts/ensure-iis-express.ps1
      - name: Install browser test dependencies
        shell: powershell
        run: |
          npm ci --prefix tests/browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/browser/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the Web Forms, WinForms and REST workflow on Windows
        shell: powershell
        run: scripts/start-demo.ps1 -Smoke
      - name: Store actual screenshots and server startup logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fechaturma-browser-evidence
          path: |
            artifacts/screenshots/*.png
            artifacts/iis.stdout.log
            artifacts/iis.stderr.log
          if-no-files-found: ignore
          retention-days: 14
